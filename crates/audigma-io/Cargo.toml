[package]
name = "audigma-io"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Concrete file, stdio, and platform audio I/O backends for audigma"

[features]
default = ["alsa", "dbus", "pipewire"]
alsa = ["dep:alsa"]
dbus = ["dep:zbus"]
pipewire = ["dep:pipewire", "dep:libspa"]
# `JsonSchema` derives for the probe reports (configurator schema pipeline).
schema = ["dep:schemars"]

[dependencies]
audigma-dsp = { path = "../audigma-dsp" }
audigma-format = { path = "../audigma-format" }
audigma-settings = { path = "../audigma-settings" }
audigma-engine = { path = "../audigma-engine" }
audigma-log = { path = "../audigma-log" }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rtrb = { workspace = true }
alsa = { workspace = true, optional = true }
libc = { workspace = true }
schemars = { workspace = true, optional = true }


zbus = { workspace = true, optional = true }
pipewire = { workspace = true, optional = true, features = ["v0_3_50"] }
libspa = { workspace = true, optional = true }



[dev-dependencies]
hound = { workspace = true }
tempfile = { workspace = true }
