[package]
name = "audigma-configurator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Configurator core for audigma: schema pipeline, assists, draft and config writer"

[features]
default = []
tui = ["dep:ratatui"]

[dependencies]
ratatui = { workspace = true, optional = true }
audigma-settings = { path = "../audigma-settings", features = ["meta", "schema"] }
audigma-dsp = { path = "../audigma-dsp" }
audigma-engine = { path = "../audigma-engine" }
audigma-format = { path = "../audigma-format" }
audigma-io = { path = "../audigma-io", features = ["schema"] }
schemars = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true }

[dev-dependencies]

