## Lines starting with `##` are generated by `audigma configure` and are
## rewritten on every save. Use a single `#` for your own notes.
schema_version = 1

## Where audio comes from and which formats are accepted.
##
## The virtual PipeWire sink that applications play into, plus how files and
## stdin are interpreted. Most of it only matters for `audigma run`; the sample
## format of raw stdin matters for `play` and `convert`.
[input]
## Channel order and meaning.
##
## The list length must match `channels`. Recognized tokens:
## `FL FR FC LFE RL RR SL SR MONO RC FLC FRC UNKNOWN[_n]`.
##
## The declared order is kept exactly, never normalized, so `["FR", "FL"]`
## deliberately swaps stereo. Leave it unset for standard layouts.
##
## Default: synthesized from channels: 1 MONO; 2 FL FR; 4 FL FR RL RR; 6 FL FR
## FC LFE RL RR; 8 adds SL SR; otherwise UNKNOWN_n.
channel_positions = ["FR", "FL"]

## DSD input processing.
##
## Settings for the DSD to PCM decimation stage applied to DSD input.
[input.dsd]
## Level alignment applied after DSD decimation.
##
## SACD reference level sits 6 dB below full scale in the raw 1-bit stream. The
## default +6.0 dB brings 0 dB SACD to 0 dBFS PCM, so DSD and PCM tracks play at
## matched loudness.
##
## Change it only to deliberately attenuate or boost DSD relative to PCM.
## Headroom for the result is handled by `[gain]`.
##
## Default: `6.0`. Range: -30 to 30.
gain_db = -1.0

## The format audigma produces: PCM or DSD, and at what rate.
##
## Sets the final output format and rate, the rate family policy, and for PCM
## the sample format and dither. Everything upstream of the DAC is converted to
## this.
[target]
## Output stream format: PCM or DSD.
##
## Selects whether audigma outputs high-rate PCM or remodulates the audio into a
## 1-bit DSD stream. This choice affects everything else in `[target]`.
##
## Many modern delta-sigma DACs convert incoming PCM to a high-rate delta-sigma
## stream internally, using on-chip filters that are limited by power and
## silicon budget. Feeding such a DAC DSD moves that oversampling and noise
## shaping onto your computer's CPU, and most of these DACs then skip their own
## digital interpolation filters. How much of the DAC's internal chain is
## bypassed depends on the chip, so check your DAC's documentation.
##
## High-rate PCM upsamples to rates such as 384 or 768 kHz, which moves filter
## imaging and ringing well above the audible band, and needs far less CPU than
## real-time DSD modulation.
##
## - `pcm`: Upsamples with the resampler filter chain and quantizes to the
##   chosen sample format. Works with PipeWire, exclusive ALSA, and WAV/FLAC
##   files.
## - `dsd`: Upsamples and remodulates to 1 bit. Requires exclusive ALSA (native
##   DSD or DoP transport) or a DSF/raw file. Needs far more CPU than PCM at the
##   same quality. Caution: DSD output cannot use the PipeWire output backend.
format = "pcm"

## PCM output sample rate.
##
## Any multiple of 44.1 kHz or 48 kHz (for example 96000, 192000, 384000,
## 705600, 768000).
##
## This sets the rate *tier*. When the output family is pinned, or follows the
## source into the other family, the matching rate in that family is used:
## 192000 in the 48 kHz family becomes 176400 in the 44.1 kHz family.
##
## Higher tiers move more of the filtering above the audible band but cost
## proportionally more CPU, and must be supported by the DAC.
pcm_rate_hz = 192000

## Level before processing, headroom and overload handling.
##
## A fixed preamp, the extra margin kept below the stable input limit of the
## 1-bit modulator, true-peak analysis for conversions, and what happens if the
## modulator overloads.
[gain]
## Fixed gain applied before all processing (dB).
##
## A constant gain applied to the floating-point signal before resampling and
## modulation.
##
## Volume changes (`audigma set volume`, `play -v`) are layered on top of it, so
## use this for a permanent level trim (for example to match loudness between
## setups), not for day-to-day volume.
##
## Positive values can clip PCM output or overload the 1-bit modulator. DSD
## targets also get an automatic attenuation to keep the modulator stable (see
## `dsd_safety_margin_db`); PCM targets get none.
##
## Default: `0.0`. Range: -120 to 12.
preamp_db = -3.0

## Filter and modulator choices used for upsampling, and drift correction.
##
## Filter phase, how the first upsampling stage rolls off near 20 kHz, and the
## order of the 1-bit modulator for DSD targets. The defaults are flat to 20 kHz
## with a linear-phase filter.
[resampler]
## Filter phase response.
##
## Selects the phase behaviour of the interpolation filters. Both settings are
## equally flat in level across the audio band.
##
## - `linear`: Symmetric impulse response. All frequencies stay time-aligned,
##   but the filter rings before sharp transients as well as after them
##   (pre-ringing). Delay is about 1.3 ms.
## - `minimum`: Asymmetric impulse response. No pre-ringing from this stage; all
##   ringing follows the transient. Delay is about 0.1 ms, but frequencies are
##   delayed unevenly (phase shift, mostly towards the top of the band).
##
## Default: `linear`.
phase = "minimum"

## Trade top-of-band level for less ringing.
##
## Applies to the first upsampling stage only. It decides where that stage rolls
## off.
##
## The numeric values are the pass edge in Hz. The response rolls off from the
## edge and reaches full rejection at 22.05 kHz, which shortens the ringing at
## the cost of attenuating the top of the audio band. For 48 kHz sources the
## edge is scaled by 48/44.1. Whether the shorter ringing is audible is a matter
## of taste; the level loss is measurable.
##
## - `off`: Flat to 20 kHz, then a steep cutoff with full rejection at 24.1 kHz.
## - `gentle`: Rolls off from a 19 kHz pass edge, with about -0.8 dB at 20 kHz.
##   The config file also accepts `19000` for the same setting. Caution:
##   Attenuates the top of the audio band (above about 19 kHz).
## - `18000`: Pass edge 18 kHz. Measured level at 20 kHz: about -5.7 dB.
##   Caution: Attenuates the top of the audio band (above about 18 kHz).
## - `18500`: Pass edge 18.5 kHz. Measured level at 20 kHz: about -2.8 dB.
##   Caution: Attenuates the top of the audio band (above about 18.5 kHz).
## - `20000`: Pass edge 20 kHz. The stage is flat at 20 kHz (its -3 dB point is
##   20.9 kHz) but is the longest filter (409 taps) and costs noticeably more
##   CPU at DSD64.
##
## Default: `off`.
apodization = 18000

## Threads, CPU placement, real-time scheduling and the tray icon.
##
## How many threads run the DSP, which cores they use and whether real-time
## priority is requested, and whether the daemon shows a system tray icon. The
## defaults suit most machines; change them to fix dropouts on a loaded or small
## CPU.
[runtime]
## How many threads run the DSP.
##
## Channels are spread over the worker threads; a worker handles its channels
## one after the other. One worker, or `inline`, needs about twice the time of a
## stereo pair of workers. On the reference machine that is enough up to about
## DSD256. Use it on small CPUs or for light targets only.
##
## Offline commands (`convert`, `play`, `benchmark`) use the same setting, with
## two channels.
##
## - `auto`: Uses `min(channels, max(1, usable physical cores - 1))` threads,
##   which is one thread per channel for stereo on a machine with 4 or more
##   cores. It never picks `inline` or a single thread.
## - `inline`: All channels are processed one after the other on the audio loop
##   thread. The output is bit-identical.
## - A whole number from 1 to 256: That many worker threads, at most one per
##   channel. Use a whole number of at least 1.
##
## Default: `auto`.
dsp_threads = 4
