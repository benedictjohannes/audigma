## Lines starting with `##` are generated by `audigma configure` and are
## rewritten on every save. Use a single `#` for your own notes.
schema_version = 1

## Where audio comes from and which formats are accepted.
[input]
## Channel order and meaning. Default: synthesized from channels: 1 MONO; 2 FL
## FR; 4 FL FR RL RR; 6 FL FR FC LFE RL RR; 8 adds SL SR; otherwise UNKNOWN_n.
channel_positions = ["FR", "FL"]

## DSD input processing.
[input.dsd]
## Level alignment applied after DSD decimation. Default: 6.0. Range: -30 to 30.
gain_db = -1.0

## The format audigma produces: PCM or DSD, and at what rate.
[target]
## Output stream format: PCM or DSD. Values: pcm, dsd.
format = "pcm"

## PCM output sample rate.
pcm_rate_hz = 192000

## Level before processing, headroom and overload handling.
[gain]
## Fixed gain applied before all processing (dB). Default: 0.0. Range: -120 to
## 12.
preamp_db = -3.0

## Filter and modulator choices used for upsampling, and drift correction.
[resampler]
## Filter phase response. Values: linear (default), minimum.
phase = "minimum"

## Trade top-of-band level for less ringing. Values: off (default), gentle,
## 18000, 18500, 20000.
apodization = 18000

## Threads, CPU placement, real-time scheduling and the tray icon.
[runtime]
## How many threads run the DSP. Values: auto (default), inline, or a whole
## number from 1 to 256.
dsp_threads = 4
