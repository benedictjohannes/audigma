[package]
name = "audigma-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Audigma command-line interface, foreground runner, and control client"

[[bin]]
name = "audigma"
path = "src/main.rs"

[features]
default = ["alsa", "dbus", "pipewire", "tui", "web"]
tui = ["audigma-configurator/tui"]
web = []
alsa = ["audigma-io/alsa"]
dbus = ["audigma-io/dbus"]
pipewire = ["audigma-io/pipewire"]

[dependencies]
audigma-configurator = { path = "../audigma-configurator" }
audigma-dsp = { path = "../audigma-dsp" }
audigma-format = { path = "../audigma-format" }
audigma-settings = { path = "../audigma-settings" }
audigma-engine = { path = "../audigma-engine" }
audigma-io = { path = "../audigma-io" }
audigma-log = { path = "../audigma-log" }
tracing = { workspace = true }
libc = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }

[dev-dependencies]
hound = { workspace = true }
tempfile = { workspace = true }

