[package]
name = "audigma-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Schema v1 TOML configuration parser and config validator for audigma"

[dependencies]
audigma-dsp = { path = "../audigma-dsp" }
audigma-format = { path = "../audigma-format" }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true, optional = true }

[features]
# Typed configurator metadata (`meta/*.toml`) and its loader.
meta = ["dep:serde_json"]

[dev-dependencies]
# Run the metadata tests in a plain `cargo test`.
audigma-settings = { path = ".", features = ["meta"] }
