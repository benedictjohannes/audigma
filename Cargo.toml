[workspace]
resolver = "2"
members = [
    "crates/audigma-dsp",
    "crates/audigma-format",
    "crates/audigma-settings",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/quirkies/audigma"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
thiserror = "2.0"
