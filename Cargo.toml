[workspace]
resolver = "2"
members = [
    "crates/audigma-dsp",
    "crates/audigma-flac",
    "crates/audigma-format",
    "crates/audigma-settings",
    "crates/audigma-configurator",
    "crates/audigma-engine",
    "crates/audigma-io",
    "crates/audigma-cli",
    "crates/audigma-log",
    "crates/audigma-measurements",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/quirkies/audigma"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.1"
toml = "0.8"
toml_edit = "0.22"
thiserror = "2.0"
clap = { version = "=4.5.53", features = ["derive", "env"] }
symphonia = { version = "0.6", default-features = false, features = ["wav", "flac", "pcm", "opt-simd"] }
hound = "3.5"
audigma-flac = { path = "crates/audigma-flac" }
alsa = "0.12"
rtrb = "0.4.0"
smallvec = "1.16"
zbus = "5"
pipewire = "0.10.1"
libspa = "0.10.1"
libc = "0.2"
tempfile = "3.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }
tracing-appender = "0.2"
time = "0.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }







