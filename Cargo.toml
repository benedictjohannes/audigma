[workspace]
resolver = "2"
members = [
    "crates/audigma-dsp",
    "crates/audigma-format",
    "crates/audigma-settings",
    "crates/audigma-engine",
    "crates/audigma-io",
    "crates/audigma-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/quirkies/audigma"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
clap = { version = "=4.5.53", features = ["derive"] }
symphonia = { version = "0.6", default-features = false, features = ["wav", "flac", "pcm", "opt-simd"] }
hound = "3.5"
flacenc = "0.5"
alsa = "0.12"
rtrb = "0.4.0"
zbus = "6.0.0"
pipewire = "0.10.1"
libspa = "0.10.1"
libc = "0.2"
tempfile = "3.17"







